openapi: 3.1.0
info:
  title: Quicksand Guest Agent
  description: |
    HTTP API running inside the guest VM to handle commands from the host.

    ## Authentication
    - Token and port are passed via kernel command line (`quicksand_token`, `quicksand_port`)
    - All endpoints except `/authenticate` require `Authorization: Bearer <token>` header

    ## Optional stdin streaming
    Successful authentication advertises `capabilities: ["stdin_streaming"]`.
    Released images without this capability do not support stdin streaming;
    clients must check the capability before sending `stdin_id`.

    The virtio-serial transport uses the same execute_stream, stdin, and cancel
    parameters. Its successful authenticate result includes the same capabilities.
    Control replies are `{"id": <control request id>, "result": <response>}`.
    Every streaming event includes the original execute_stream request `id`.
    Invalid serial requests receive `{"id": <request id>, "error": {"message": ...}}`;
    rejected stdin-enabled execute_stream requests also receive an exit event with
    exit_code -1. Stdin and cancel controls require an authenticated serial session
    and are processed independently of exclusive commands and blocked stdin writes.
  version: 1.0.0

servers:
  - url: http://localhost:{port}
    description: Guest VM agent
    variables:
      port:
        default: "8080"
        description: Port from kernel cmdline `quicksand_port`

security:
  - tokenAuth: []

components:
  securitySchemes:
    tokenAuth:
      type: http
      scheme: bearer
      description: Bearer token from kernel cmdline `quicksand_token`

  schemas:
    AuthRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Token to verify

    AuthResponse:
      type: object
      required:
        - authenticated
      properties:
        authenticated:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
          description: |
            Successful authentication includes "stdin_streaming". Older guest
            images omit this field; clients must not assume support when absent.

    ExecuteRequest:
      type: object
      required:
        - command
      properties:
        command:
          type: string
          description: Shell command to execute
        timeout:
          type: number
          format: float
          default: 30.0
          description: Command timeout in seconds
        cwd:
          type: string
          nullable: true
          description: Working directory for command execution
        exclusive:
          type: boolean
          default: false
          description: Reject other execution requests while this command runs

    StdinId:
      type: string
      pattern: '^[0-9a-fA-F]{32}$'
      description: Random UUID hex string identifying one stdin-enabled execution

    ExecuteStreamRequest:
      allOf:
        - $ref: '#/components/schemas/ExecuteRequest'
        - type: object
          properties:
            stdin_id:
              $ref: '#/components/schemas/StdinId'
            shell:
              type: string
              default: /bin/sh
              description: |
                Shell executable for stdin-enabled execution, invoked with -c.
                Without stdin_id, execution retains the legacy /bin/sh behavior.

    StdinRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [stdin_id, data]
          properties:
            stdin_id:
              $ref: '#/components/schemas/StdinId'
            data:
              type: string
              contentEncoding: base64
              maxLength: 87384
              description: |
                Standard padded base64, decoding to at most 65536 bytes.
                Empty data is allowed and is not EOF. Invalid base64, oversized
                decoded chunks, and data combined with eof are rejected.
        - type: object
          additionalProperties: false
          required: [stdin_id, eof]
          properties:
            stdin_id:
              $ref: '#/components/schemas/StdinId'
            eof:
              type: boolean
              const: true
              description: Close the child's stdin pipe; false or null is invalid

    StdinResponse:
      type: object
      required: [closed]
      properties:
        closed:
          type: boolean
          description: |
            False only after the entire chunk has actually been written to the
            child pipe, not merely queued. True after EOF or if input is already
            closed, the child exited, or stdin_id is absent/completed. A broken
            pipe is closed input, not a failure of an otherwise successful command.
            EOF/BrokenPipe closes only stdin: stdin_id remains cancellable while
            the command continues processing, until execution cleanup completes.

    CancelRequest:
      type: object
      additionalProperties: false
      required: [stdin_id]
      properties:
        stdin_id:
          $ref: '#/components/schemas/StdinId'

    CancelResponse:
      type: object
      required: [cancelled]
      properties:
        cancelled:
          type: boolean
          description: |
            True after cancelling a live stdin execution and completing its
            process cleanup. False when absent, completed, or already cancelled.

    ExecuteResponse:
      type: object
      required:
        - stdout
        - stderr
        - exit_code
      properties:
        stdout:
          type: string
          description: Standard output from command
        stderr:
          type: string
          description: Standard error from command
        exit_code:
          type: integer
          description: Exit code (-1 for timeout/error)

    ExecuteStreamEvent:
      type: object
      required:
        - stream
      properties:
        stream:
          type: string
          enum: [ready, stdout, stderr, exit]
          description: |
            ready occurs only for stdin-enabled execution, after registration
            and process startup. Startup failure instead emits stderr and exit.
        data:
          type: string
          description: |
            Output text (stdout/stderr events). With stdin_id, output is
            incremental even without a newline and does not add newlines.
            UTF-8 characters split across reads are preserved; invalid UTF-8 is
            replaced with U+FFFD. Startup, timeout, and cancellation failures
            emit a stderr message followed by exit_code -1.
        exit_code:
          type: integer
          description: Process exit code (for exit events only)

    PingResponse:
      type: object
      required:
        - pong
        - pid
      properties:
        pong:
          type: boolean
          const: true
        pid:
          type: integer
          description: Agent process ID

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Error message

paths:
  /authenticate:
    post:
      summary: Verify authentication token
      description: |
        Verify that a token is valid. This endpoint does NOT require
        the Authorization header - the token is passed in the request body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /execute:
    post:
      summary: Execute a shell command
      description: |
        Run a shell command in the guest VM and return stdout, stderr, and exit code.
        Commands are executed via `/bin/sh -c`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequest'
      responses:
        '200':
          description: Command executed (check exit_code for success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteResponse'
        '401':
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /execute_stream:
    post:
      summary: Execute a shell command with streaming output
      description: |
        Run a shell command and stream stdout/stderr as SSE events in real-time.
        Without stdin_id, preserve legacy execution and line-based output.
        With stdin_id, pipe stdin and emit {"stream":"ready"} after the process
        and registry entry are ready. Hosts wait for ready before sending input
        via /stdin. An active stdin_id cannot be reused or overwritten.

        The response is a text/event-stream with JSON in ordinary SSE data
        events: ready, stdout/stderr with data strings, and exit with exit_code.
        Command output is incremental, including text without a trailing newline.
        Stdout/stderr events can arrive before any input is sent. A startup
        failure emits a stderr message and exit_code -1 without ready.

        Timeout, /cancel, or output transport disconnection terminates the
        command's process group and descendants, reaps the child, closes stdin,
        removes the registry entry, and releases exclusivity. Timeout/cancel
        emits a stderr message followed by exit_code -1 when connected.
        Cleanup does not wait for the host to consume final output.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteStreamRequest'
      responses:
        '200':
          description: SSE stream of command output
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ExecuteStreamEvent'
        '401':
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid stdin_id or stdin-enabled execution parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: stdin_id is already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: An exclusive command is already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stdin:
    post:
      summary: Write an acknowledged binary stdin chunk or close stdin
      description: |
        Requires bearer authentication, including while an exclusive command
        runs. Submit either a base64 data chunk or eof: true, never both.
        Hosts send one chunk at a time and await its acknowledgement. Do not
        retry requests: chunks are not deduplicated. Buffering is bounded;
        excess concurrent writes are rejected rather than queued indefinitely.
        On closed: true, stop producing input and await the execution's final
        output. When the input iterable is exhausted, send eof: true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StdinRequest'
      responses:
        '200':
          description: Chunk written, EOF applied, or input already closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StdinResponse'
        '400':
          description: Malformed request, invalid base64, or decoded chunk over 65536 bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A stdin request is already pending and the bounded queue is full
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected pipe write error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cancel:
    post:
      summary: Cancel a stdin-enabled execution and clean up its process group
      description: |
        Requires bearer authentication. Works during exclusive execution and
        while a stdin write is blocked. Hosts cancel when their input producer
        raises or the execute operation is cancelled. Unrelated executions
        are not cancelled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          description: Execution cancelled and reaped, or already absent/completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '400':
          description: Malformed cancel request or invalid stdin_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ping:
    get:
      summary: Health check
      description: Simple health check that returns the agent's process ID.
      responses:
        '200':
          description: Agent is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '401':
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
